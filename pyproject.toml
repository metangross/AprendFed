[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedavg-app"
version = "1.0.0"
description = "FedAvg com Flower + PyTorch (GPU), clientes em containers Docker"
license = "Apache-2.0"
# As dependências já vêm instaladas na imagem Docker (ver docker/Dockerfile).
dependencies = [
    "flwr==1.30.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "pyarrow>=15",
    "pillow",
    "nvidia-ml-py>=12",
]

[tool.hatch.build.targets.wheel]
packages = ["fedavg_app"]

[tool.flwr.app]
publisher = "aprendfed"

[tool.flwr.app.components]
serverapp = "fedavg_app.server_app:app"
clientapp = "fedavg_app.client_app:app"

# Configuração do experimento. Pode ser sobrescrita na execução, ex.:
#   ./run.sh -c "num-server-rounds=20 lr=0.05"
[tool.flwr.app.config]
num-server-rounds = 10
model = "cnn"               # "cnn" ou "mobilenet_v3_small"
pretrained = false          # pesos do ImageNet (só para mobilenet_v3_small)
image-size = 32             # ampliar a entrada (ex.: 96) ajuda modelos de ImageNet
fraction-train = 1.0        # fração de clientes sorteados para treinar em cada rodada
fraction-evaluate = 1.0     # fração de clientes sorteados para avaliar em cada rodada
min-nodes = 2               # mínimo de clientes conectados para iniciar uma rodada
local-epochs = 1
batch-size = 64
lr = 0.01
momentum = 0.9
dataset = "cifar10"         # "cifar10" ou "femnist" (caracteres escritos à mão, 62 classes)
partitioning = "iid"        # "iid", "dirichlet" (não-IID) ou "writer" (só FEMNIST)
dirichlet-alpha = 0.5       # usado apenas quando partitioning = "dirichlet"
# FEMNIST: escritores sorteados por cliente (~226 caracteres cada). Com "writer",
# cada cliente fica com os seus escritores inteiros (partição natural, por usuário).
writers-per-client = 12
seed = 42
# Heterogeneidade de hardware (a velocidade de cada cliente fica no
# docker-compose.yml, em --node-config compute-speed=...):
#   "wait"    -> servidor espera todos; clientes lentos só atrasam a rodada
#   "partial" -> cliente para no prazo e envia o que treinou (peso menor)
#   "drop"    -> cliente que estoura o prazo é descartado da rodada
straggler-policy = "wait"
round-deadline = 0.5        # segundos (tempo emulado); ignorado em "wait"
# Energia e bateria (docs/custo_energia_rodada.pdf). Exige o perfil da GPU em
# fedavg_app/profiles/ (`docker compose run --rm profiler`). Bateria inicial,
# potência e rede de cada cliente ficam no --node-config (gen_compose.py).
energy = false              # contabiliza a energia de cada rodada e desconta da bateria
energy-fixed-j = 0.0        # D: custo fixo por rodada em J (acordar, cauda do rádio)
#   "idle"    -> desconta o repouso (P8): o treino paga o cálculo e o clock alto
#   "awake"   -> desconta a GPU acordada (P1): o treino paga só o cálculo
# Runs com bases diferentes não são comparáveis; a escolha vai para o metrics.json.
energy-baseline = "idle"
#   "drop"    -> treina até a bateria acabar e é descartado (FedAvg sem controle)
#   "partial" -> para a tempo de enviar o modelo e envia o que treinou
battery-empty-policy = "drop"
# Fração dos dados locais treinada em cada rodada, conforme a bateria:
#   "none"      -> todos os dados (FedAvg)
#   "leanfed"   -> LeanFed original: η = orçamento / A (ignora rede e custo fixo)
#   "leanfed-c" -> LeanFed corrigido: η = (orçamento − C − D) / A
# orçamento = bateria / participações restantes; com η = 0 o cliente pula a rodada.
energy-policy = "none"
# C reservado pelo leanfed-c, pela vazão da faixa do cliente:
#   "mean"    -> custo médio
#   "0.75"... -> percentil do custo (mais conservador quanto maior)
comm-estimate = "mean"
# Refaz η depois do download, com o custo real dele e só o upload estimado.
eta-after-download = false
# Com η abaixo disso, o cliente pula a rodada e guarda a energia para participar
# depois com mais dados (exceto na última participação). 0 = participa com qualquer η.
min-data-fraction = 0.0
# Margem guardada fora do orçamento até a última participação: o percentil q da
# comunicação + o custo fixo. Na última, o cliente usa a bateria toda e reserva a
# comunicação pelo mesmo percentil. Evita morrer no fim por uma rodada de rede
# ruim, quando a bateria já não tem folga. 0 = sem margem.
tail-margin = 0.0
data-dir = "/data"
output-dir = "/outputs"
